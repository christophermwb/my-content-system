<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tone Checker — my-content-system</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container { max-width: 760px; margin: 0 auto; }

    header { margin-bottom: 2rem; }
    h1 { font-size: 1.5rem; font-weight: 600; color: #0f172a; }
    .subtitle { font-size: 0.875rem; color: #64748b; margin-top: 0.25rem; }

    .card {
      background: #fff;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    .card-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 0.75rem;
    }

    /* API key */
    .api-key-row { display: flex; gap: 0.5rem; align-items: center; }

    .api-key-input {
      flex: 1;
      font-family: monospace;
      font-size: 0.875rem;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      background: #f8fafc;
      color: #1a1a1a;
    }
    .api-key-input:focus { outline: none; border-color: #6366f1; background: #fff; }

    .btn-save {
      font-size: 0.8rem;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      color: #374151;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-save:hover { background: #f1f5f9; }

    .key-status { font-size: 0.75rem; margin-top: 0.5rem; }
    .key-status.saved  { color: #16a34a; }
    .key-status.missing { color: #dc2626; }

    /* Textarea */
    textarea {
      width: 100%;
      min-height: 160px;
      font-size: 0.9375rem;
      line-height: 1.6;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 0.75rem;
      resize: vertical;
      font-family: inherit;
      color: #1a1a1a;
    }
    textarea:focus { outline: none; border-color: #6366f1; }

    .textarea-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.75rem;
    }

    .char-count { font-size: 0.75rem; color: #94a3b8; }

    .btn-submit {
      background: #0f172a;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.625rem 1.5rem;
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-submit:hover    { background: #1e293b; }
    .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: #64748b;
      font-size: 0.9rem;
      padding: 1rem 0;
    }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid #e2e8f0;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Results */
    #results { display: none; }

    .verdict-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1rem;
      font-weight: 700;
      padding: 0.375rem 0.875rem;
      border-radius: 999px;
      margin-bottom: 1.25rem;
    }
    .verdict-badge.pass           { background: #dcfce7; color: #15803d; }
    .verdict-badge.needs-revision { background: #fef3c7; color: #b45309; }

    .section-title {
      font-size: 0.8125rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 0.5rem;
    }

    .violations-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
    .violations-list li {
      font-size: 0.9rem;
      padding: 0.625rem 0.875rem;
      background: #fff7ed;
      border-left: 3px solid #f97316;
      border-radius: 0 4px 4px 0;
      color: #431407;
      line-height: 1.5;
    }

    .no-violations { font-size: 0.9rem; color: #16a34a; }

    .divider { border: none; border-top: 1px solid #f1f5f9; margin: 1.25rem 0; }

    .rewrite-box {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 6px;
      padding: 1rem;
      font-size: 0.9375rem;
      line-height: 1.6;
      color: #14532d;
      white-space: pre-wrap;
    }

    .error-msg {
      color: #dc2626;
      font-size: 0.875rem;
      padding: 0.75rem;
      background: #fef2f2;
      border-radius: 6px;
      border: 1px solid #fecaca;
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>Tone Checker</h1>
    <p class="subtitle">Ordergroove Content Design Guidelines — my-content-system</p>
  </header>

  <!-- API Key -->
  <div class="card">
    <div class="card-label">API Key</div>
    <div class="api-key-row">
      <input type="password" id="apiKey" class="api-key-input" placeholder="sk-ant-…" autocomplete="off">
      <button class="btn-save" onclick="saveKey()">Save</button>
    </div>
    <div class="key-status" id="keyStatus"></div>
  </div>

  <!-- Input -->
  <div class="card">
    <div class="card-label">Copy to Review</div>
    <textarea id="copy" placeholder="Paste your copy here…" oninput="updateCount()"></textarea>
    <div class="textarea-footer">
      <span class="char-count" id="charCount">0 characters</span>
      <button class="btn-submit" id="submitBtn" onclick="runCheck()">Check tone</button>
    </div>
  </div>

  <!-- Loading -->
  <div id="loading" style="display:none">
    <div class="loading">
      <div class="spinner"></div>
      Checking against Intuit guidelines…
    </div>
  </div>

  <!-- Results -->
  <div class="card" id="results">
    <div id="verdictBadge"></div>
    <div class="section-title">Violations</div>
    <div id="violationsArea"></div>
    <div id="rewriteSection" style="display:none">
      <hr class="divider">
      <div class="section-title">Suggested Rewrite</div>
      <div class="rewrite-box" id="rewriteBox"></div>
    </div>
  </div>

</div>
<script>
  const SYSTEM_PROMPT = `You are a content reviewer enforcing the Intuit Content Design Guidelines. Review the copy and return ONLY valid JSON — no prose, no markdown fences, no explanation outside the JSON object.

VOICE & TONE
- Warm, confident, genuine. Not stiff, corporate, or sappy.
- Never tell customers how they will feel ("You're going to love this" is banned).
- Acknowledge challenges honestly. "Don't worry" only in genuinely low-stakes situations.
- Customer benefit first. No manipulation, upsell pressure, or overpromising.

SUPERLATIVES — flag every instance unless a cited source follows
- Banned: best, most, top, fastest, ultimate, premier, most-trusted, world-class, #1, amazing, high-quality
- "great" is usually a flag — "good" is almost always better

BREVITY & READABILITY
- Short sentences. Short paragraphs (1–2 sentences).
- 5th–8th grade reading level. Front-load the key message.
- "simple" and "simply" are banned — simplicity is subjective.
- Short everyday words: "use" not "utilize"

WORD FLAGS
- "log in / log on / log out" → "sign in / sign out"
- "sign into" → "sign in to"
- "since" for cause-and-effect → "because"
- "due to the fact that" → never acceptable
- "sorry" as filler → only when something genuinely failed
- "above" or "below" as directional cues → name the specific element
- "utilize" → "use"
- "a.m." / "p.m." → "AM" / "PM"
- "bank statement" → "account statement"
- "401K" or "401k" → "401(k)"

FORMATTING
- En dash (–) or hyphen (-) for thought separation → em dash (—)
- Ampersand (&) in body text → "and"
- Angle bracket paths (Settings > Account) → write out with "select"
- ALL CAPS except established acronyms → flag

ERROR MESSAGES
- Must: acknowledge what happened, explain why, end with one clear action.
- Never blame the user.

CELEBRATIONS
- Only for genuine customer milestones — not routine actions.
- Never tell the customer how to feel.

Return exactly this JSON shape:
{
  "verdict": "PASS" or "NEEDS REVISION",
  "violations": ["rule broken → what to fix"],
  "rewrite": "clean version of the full copy, or null if verdict is PASS"
}`;

  // Init key
  const saved = localStorage.getItem('intuit_tc_key');
  if (saved) { document.getElementById('apiKey').value = saved; setKeyStatus(true); }
  else { setKeyStatus(false); }

  function saveKey() {
    const v = document.getElementById('apiKey').value.trim();
    if (!v) return;
    localStorage.setItem('intuit_tc_key', v);
    setKeyStatus(true);
  }

  function setKeyStatus(ok) {
    const el = document.getElementById('keyStatus');
    el.textContent = ok ? 'Key saved locally' : 'No key saved';
    el.className = 'key-status ' + (ok ? 'saved' : 'missing');
  }

  function updateCount() {
    const n = document.getElementById('copy').value.length;
    document.getElementById('charCount').textContent =
      n.toLocaleString() + ' character' + (n === 1 ? '' : 's');
  }

  async function runCheck() {
    const apiKey = localStorage.getItem('intuit_tc_key');
    const copy   = document.getElementById('copy').value.trim();

    if (!apiKey) { alert('Save your API key first.'); return; }
    if (!copy)   { alert('Paste some copy to review.'); return; }

    document.getElementById('results').style.display  = 'none';
    document.getElementById('loading').style.display  = 'block';
    document.getElementById('submitBtn').disabled     = true;

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 1024,
          system: SYSTEM_PROMPT,
          messages: [{ role: 'user', content: copy }]
        })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err?.error?.message || 'API error ' + res.status);
      }

      const data = await res.json();
      const raw  = data.content[0].text.trim()
                       .replace(/^```json\s*/i, '').replace(/\s*```$/, '');
      const json = JSON.parse(raw);
      showResults(json);

    } catch (e) {
      document.getElementById('results').style.display = 'block';
      document.getElementById('verdictBadge').innerHTML =
        `<div class="error-msg">Error: ${esc(e.message)}</div>`;
      document.getElementById('violationsArea').innerHTML = '';
      document.getElementById('rewriteSection').style.display = 'none';
    } finally {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('submitBtn').disabled    = false;
    }
  }

  function showResults(json) {
    const pass = json.verdict === 'PASS';

    document.getElementById('verdictBadge').innerHTML =
      `<div class="verdict-badge ${pass ? 'pass' : 'needs-revision'}">
         ${pass ? '✓ Pass' : '✗ Needs revision'}
       </div>`;

    const va = document.getElementById('violationsArea');
    if (!json.violations || json.violations.length === 0) {
      va.innerHTML = '<p class="no-violations">No violations found.</p>';
    } else {
      va.innerHTML = '<ul class="violations-list">' +
        json.violations.map(v => `<li>${esc(v)}</li>`).join('') + '</ul>';
    }

    const rs = document.getElementById('rewriteSection');
    if (!pass && json.rewrite) {
      document.getElementById('rewriteBox').textContent = json.rewrite;
      rs.style.display = 'block';
    } else {
      rs.style.display = 'none';
    }

    document.getElementById('results').style.display = 'block';
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
